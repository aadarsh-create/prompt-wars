services:
  - type: web
    name: prompt-wars-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
